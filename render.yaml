# Blueprint do Render: site estático, sem etapa de build.
services:
  - type: web
    name: epa-viewer
    runtime: static
    buildCommand: echo "sem build"
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
