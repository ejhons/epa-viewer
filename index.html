<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Editor web de arquivos .INP do EPANET e do SWMM: tabelas, formulários, edição em lote, séries e hietogramas.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <title>Editor INP — EPANET / SWMM</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="top">
    <span class="brand"><img src="assets/logo.png" alt="" class="logo">Editor INP</span>
    <button id="btnOpen">Abrir .inp…</button>
    <input type="file" id="file" accept=".inp,.txt,text/plain" hidden>
    <span id="fileInfo" class="muted"></span>
    <span class="spacer"></span>
    <span id="tools" class="hide" style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="btnDemand" class="hide">Demandas em lote…</button>
      <button id="btnHyeto" class="hide">Hietograma…</button>
      <button id="btnFind">Localizar/substituir…</button>
    </span>
    <button id="btnUndo" disabled>Desfazer</button>
    <button id="btnSave" class="primary" disabled>Baixar .inp</button>
  </header>
  <div class="layout">
    <aside id="side" class="hide">
      <input id="secSearch" class="search" type="search" placeholder="Filtrar seções…">
      <div id="secs"></div>
    </aside>
    <main id="main"></main>
  </div>
  <footer class="foot">
    <div class="foot-info">
      <img src="assets/logo.png" alt="" class="foot-logo">
      <div>
        <div class="foot-title">Editor INP <span class="muted">· EPANET / SWMM</span></div>
        <div>Desenvolvido por <strong>Everton Jhons</strong></div>
        <div class="muted foot-note">Projeto independente, sem vínculo com a U.S. EPA. EPANET e SWMM são softwares da Agência de
          Proteção Ambiental dos EUA.</div>
      </div>
    </div>
    <div class="foot-copy">© 2026 <strong>Everton Jhons</strong><br>Licença <a href="https://opensource.org/license/mit"
        target="_blank" rel="noopener">MIT</a></div>
    <nav class="foot-links" aria-label="Contato e projetos do autor">

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast"></div>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
